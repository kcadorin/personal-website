designation: DevOps Engineer


summary: |
  I am a Senior DevOps & SRE engineer with 20+ years of experience building secure, scalable cloud and bare-metal infrastructure, and I love building platform tools that solve real operational problems.

  I am also a heavy, hands-on practitioner of AI agentic coding, focused on getting the most out of it. I author custom Claude Code skills and MCP servers that make AI agents go straight to the point, and keep a persistent Obsidian engineering memory that gives instant recall of past tasks and projects — so AI acts as a long-lived teammate rather than a one-off assistant.

