experiences:
  - company:
      name: Healthcare Conversational AI Platform (US)
      overview: Healthcare chatbot platform running its production stack on self-managed, dedicated bare-metal servers instead of managed cloud.
    positions:
      - designation: Lead DevOps Engineer
        start: Feb 2024
        end: Jan 2025
        responsibilities:
          - Operated a fleet of dedicated bare-metal servers on OVH, running the platform's production workloads directly on physical hardware rather than managed cloud instances.
          - Built and ran a self-managed Kubernetes cluster on those bare-metal servers, with no managed control plane (EKS/GKE), owning the full stack from the physical hosts through networking, cluster operations, and node recovery.
          - Managed Proxmox VE hypervisors, carving physical hosts into VMs and containers to consolidate multiple workloads onto dedicated servers.
          - Codified the entire bare-metal fleet in Terraform, including several hundred OVH edge-firewall rules, with encrypted remote state and locking so the infrastructure was reproducible instead of hand-configured.
          - Wrote a Python tool against the OVH API to discover live IP blocks and firewall rules and reconcile drift back into Terraform-managed state.
          - Hardened host access with an SSH certificate authority using short-lived certificates and principal matching scoped to a devops group, replacing static SSH keys.
          - Ran self-hosted GitHub Actions runners on the bare-metal fleet to keep CI/CD close to the hardware.

  - company:
      name: Open-Source Intelligence (OSINT) Platform (EU)
      overview: Open-source intelligence provider delivering digital identity, fraud, and threat intelligence to government, law enforcement, and private investigation teams, running entirely on GCP.
    positions:
      - designation: Senior Site Reliability Engineer (Consulting)
        start: Jan 2025
        responsibilities:
          - Owned the full GCP platform (Cloud Run and GKE) as code with Pulumi and Python across dev, staging, and production, spanning VPC networking, Cloud NAT, internal load balancers, IAM, and Secret Manager.
          - Led a major cloud cost reduction, migrating latency-tolerant workloads from GKE to second-generation Cloud Run and centralizing the Datadog Agent onto a shared node-level DaemonSet behind an internal load balancer, removing per-service sidecars and cutting observability spend by roughly 2.5-2.9k USD per month.
          - Operated production Python microservices including a public intelligence API, an asynchronous live-query framework with dynamic module loading and concurrent worker pools, a stealth browser-automation service (headed Chromium under Xvfb with spoofed fingerprints) exposed over JSON and MCP, and a CAPTCHA-solving service.
          - Ran MongoDB Atlas in production, diagnosing and resolving a multi-day silent egress outage caused by a VPC egress change against IP-allowlisted clusters, then moved connectivity toward Private Service Connect endpoints and tuned connection pooling to clear saturation errors.
          - Handled GKE platform operations with ArgoCD GitOps and Helm, including a production MongoDB replica-set incident from a TLS/CA rotation, adding monitors and guardrails to prevent recurrence.
          - Managed secrets and access with Infisical and External Secrets Operator, project-level IAM on Secret Manager, Workload Identity Federation for GitHub Actions CI, and Tailscale plus IAP for break-glass access.
          - Improved Datadog (EU) observability by fixing no-data monitors, defining latency SLO ladders for slow bulk queries, and controlling custom-metric cardinality through a DogStatsD relay.

  - company:
      name: Blockchain Data & Infrastructure Platform (US)
      overview: Web3 infrastructure provider indexing on-chain data across multiple EVM-compatible networks.
    positions:
      - designation: Senior SRE / DevOps Engineer
        start: Mar 2025
        responsibilities:
          - Designed and maintained the full AWS infrastructure using Terraform and Atlantis, managing EKS clusters, Aurora PostgreSQL, ElastiCache Redis, ECS Fargate, VPCs, ALBs, and Route 53 across dev, staging, and production environments.
          - Operated multi-chain blockchain node infrastructure running full and archive nodes for Ethereum, Optimism, Arbitrum, Polygon, Avalanche, and Shape, with RPC proxying, automatic failover, and health monitoring via CloudWatch and Slack alerts.
          - Built EKS cluster operations using ArgoCD for GitOps deployments, Karpenter for node autoscaling (spot and on-demand), and a full observability stack with Prometheus, Grafana, Loki, and Promtail.
          - Contributed to a Go-based blockchain data indexing pipeline ingesting blocks, transactions, events, NFTs, balances, and smart contracts into OpenSearch, exposed via a GraphQL API.
          - Developed Claude Code plugins and MCP servers to extend AI tooling for the team, including a blockchain data query tool and an AI agent (LangGraph) for natural language blockchain data queries.
          - Implemented EKS cost optimization using spot instances, Karpenter node pools, and an automated EBS cleanup tool, alongside a Python-based cost analysis script achieving significant cloud spend reductions.
          - Managed secrets, IAM, and Kubernetes security using External Secrets Operator, AWS ACK Pod Identity, and SOPS with KMS for secure and auditable access controls.

  - company:
      name: Healthcare Technology Platform (US)
      overview: Digital health provider delivering secure care coordination and analytics solutions.
    positions:
      - designation: Senior DevOps Architect
        start: Sep 2024
        responsibilities:
          - Built an internal security scanning platform (Python + frontend) that automatically checks all container images pushed to ECR for vulnerabilities, blocks CI/CD pipelines on critical CVEs, and allows developers to request time-limited exceptions through an approval workflow.
          - Developed a self-service privileged access system providing evaporative (time-limited) credentials to databases and message brokers, with a frontend for session auditing, kill-switch capabilities, and permission configuration.
          - Created a Kubernetes secrets management tool allowing teams to safely update secret values across environments without cluster access; changes flow through a queue consumed by environment-specific listeners, with masked values for production security.
          - Built a production access request portal with multi-step approval workflow that auto-generates temporary credentials upon final approval.
          - Implemented a disaster recovery architecture in Terraform enabling full service restoration from an AWS outage in under 30 minutes.
          - Hardened multi-account AWS infrastructure with automated SOC 2 guardrails, monitoring, and bastion host access across all accounts.
          - Orchestrated complex data pipelines with Prefect and built scheduled Lambda-based data bridges for automated database schema population.

  - company:
      name: Digital Commerce Platform (Canada)
      overview: Global discounts marketplace serving high-traffic consumer brands.
    positions:
      - designation: Sysadmin & DevOps Engineer
        start: Aug 2023
        end: Aug 2024
        responsibilities:
