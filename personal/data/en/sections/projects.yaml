projects:
  - name: OneSource MCP Server
    logo: "fas fa-robot"
    role: Owner
    timeline: "Jun 2025 - Present"
    summary: |
      Production **MCP (Model Context Protocol) server** exposing on-chain blockchain data as tools to AI agents. Auto-generates its tool surface from the backend GraphQL schema via introspection, and integrates x402 pay-per-query pricing so blockchain data is programmatically queryable by AI. *(Private repository.)*
    tags: ["ai", "mcp", "web3", "blockchain", "typescript"]

  - name: AI Engineering Memory System
    logo: "fas fa-brain"
    role: Owner
    timeline: "Jul 2026 - Present"
    summary: |
      A persistent **AI engineering memory** built on Obsidian (PARA "compound engineering" vault) so every AI coding session has instant recall of past tasks and projects — no re-explaining context. Ingest → lint → query pipeline with hybrid contextual retrieval (BM25 + rerank), driven by custom Claude Code skills, subagents, and hooks. *(Private repository.)*
    tags: ["ai", "agentic", "claude-code", "knowledge"]

  - name: AWS Pricing Calculator
    logo: "fas fa-calculator"
    role: Owner
    timeline: "2025"
    repo: https://github.com/kcadorin/aws-pricing-calculator
    summary: |
      A Python tool that improves on the standard AWS pricing calculator by comparing the *additional* cost of a change against an account's existing spend — turning "what will this cost" into "what will this add".
    tags: ["devops", "aws", "python", "finops"]

  - name: Personal Portfolio Website
    logo: "fas fa-globe"
    role: Owner
    timeline: "Sep 2025 - Present"
    repo: https://github.com/kcadorin/personal-website
    summary: |
      This site — a modern, responsive portfolio built with Hugo and the Toha theme, deployed on a custom domain.
    tags: ["web", "hugo"]
